services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: mlflow-server
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "localhost,127.0.0.1,localhost:5000,mlflow,mlflow:5000"
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlflow-bootstrap
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SEED_MLFLOW_MODEL_NAME: churn-model
      GIT_PYTHON_REFRESH: quiet
    command: >
      python -m mlops_platform.bootstrap.seed_mlflow
      --model-name ${SEED_MLFLOW_MODEL_NAME:-churn-model}
      --stage Production
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - mlflow_data:/mlflow
    restart: "no"

  inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-inference-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      mlflow-bootstrap:
        condition: service_completed_successfully

volumes:
  mlflow_data:
