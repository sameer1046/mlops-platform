name: MLOps CI CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_*unit.py -q

  integration-and-api:
    runs-on: ubuntu-latest
    needs: unit-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_integration_release_flow.py tests/test_api_endpoint.py -q

  regression-and-security:
    runs-on: ubuntu-latest
    needs: integration-and-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_regression_baseline.py tests/test_security_checks.py -q

  performance-smoke:
    runs-on: ubuntu-latest
    needs: regression-and-security
    steps:
      - uses: actions/checkout@v4
      - run: python perf/load_smoke.py

  release-controls:
    runs-on: ubuntu-latest
    needs: performance-smoke
    if: github.ref == 'refs/heads/main'
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}
      MLFLOW_MODEL_VERSION: ${{ vars.MLFLOW_MODEL_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: >
          python -m mlops_platform.lifecycle.cli verify-mlflow
          --model-name "${MLFLOW_MODEL_NAME}"
          --model-version "${MLFLOW_MODEL_VERSION}"
          --allowed-stage Production
      - run: python -m mlops_platform.lifecycle.cli package --version "ci-${{ github.run_number }}"
